# Local development stack for VulnTrack.
# Day 1: infrastructure only (PostgreSQL). The backend, Keycloak, MailHog and the
# frontend are added to this file as they are built (see ROADMAP.md).
name: vulntrack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulntrack}
      POSTGRES_USER: ${POSTGRES_USER:-vulntrack}
      # Development-only default; override it through a local, git-ignored `.env`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
